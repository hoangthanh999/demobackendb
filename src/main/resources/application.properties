# =====================
# Server Configuration
# =====================
server.port=${PORT:8080}
server.servlet.context-path=/api

# =====================
# Database Configuration
# =====================
spring.datasource.url=${SPRING_DATASOURCE_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA Configuration
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# =====================
# JWT Configuration
# =====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =====================
# File Upload Configuration
# =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================
# Jackson Configuration
# =====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# =====================
# Logging
# =====================
logging.level.org.springframework.security=INFO
logging.level.com.badminton=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =====================
# Error Handling
# =====================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# =====================
# MoMo Payment Configuration
# =====================
# Lấy từ https://developers.momo.vn sau khi đăng ký
momo.partner-code=${MOMO_PARTNER_CODE:MOMOXXX}
momo.access-key=${MOMO_ACCESS_KEY:your_access_key}
momo.secret-key=${MOMO_SECRET_KEY:your_secret_key}

# Endpoint cho môi trường test
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.request-type=captureWallet

# URLs - Sử dụng biến môi trường hoặc giá trị mặc định
momo.redirect-url=${FRONTEND_URL:http://localhost:3000}/payment/result
momo.ipn-url=${BACKEND_URL:https://demobackendb.onrender.com}/payments/momo/webhook

# =====================
# Application URLs
# =====================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.backend-url=${BACKEND_URL:https://demobackendb.onrender.com}

# =====================
# Payment Configuration
# =====================
payment.deposit-percentage=${DEPOSIT_PERCENTAGE:30}
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:true}