# =====================
# Server Configuration
# =====================
server.port=${PORT:8080}
server.servlet.context-path=/api
server.error.path=/error

# =====================
# Database Configuration
# =====================
spring.datasource.url=${SPRING_DATASOURCE_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA Configuration
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# =====================
# JWT Configuration
# =====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =====================
# File Upload Configuration
# =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================
# Jackson Configuration
# =====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# =====================
# Logging
# =====================
logging.level.org.springframework.security=INFO
logging.level.com.badminton=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =====================
# Error Handling
# =====================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# =====================
# MoMo Payment Configuration
# =====================
momo.partner-code=${MOMO_PARTNER_CODE:MOMOXXX}
momo.access-key=${MOMO_ACCESS_KEY:your_access_key}
momo.secret-key=${MOMO_SECRET_KEY:your_secret_key}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.request-type=captureWallet
momo.redirect-url=${FRONTEND_URL:http://localhost:3000}/payment/result
momo.ipn-url=${BACKEND_URL:https://demobackendb.onrender.com}/payments/momo/webhook

# =====================
# Application URLs
# =====================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.backend-url=${BACKEND_URL:https://demobackendb.onrender.com}

# =====================
# Payment Configuration
# =====================
payment.deposit-percentage=${DEPOSIT_PERCENTAGE:30}
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:true}

# =====================
# Cloudinary Configuration
# =====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =====================
# Mailjet Email Configuration
# =====================
mailjet.api-key=${MAILJET_API_KEY}
mailjet.secret-key=${MAILJET_SECRET_KEY}
mailjet.from-email=${MAILJET_FROM_EMAIL:noreply@badmintoncourt.com}
mailjet.from-name=Badminton Court Management
# =====================
# AI / OpenAI Configuration
# =====================
openai.api-key=${OPENAI_API_KEY:}
# Bật / tắt AI toàn hệ thống
ai.enabled=${AI_ENABLED:true}

# Model mặc định (nên dùng gpt-5-mini)
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}

# Giới hạn token mỗi request (rất quan trọng)
ai.max-tokens=200

# Giới hạn tổng token mỗi ngày (soft limit, tự code check)
ai.daily-token-limit=10000

# Giới hạn số request AI mỗi user / ngày
ai.max-requests-per-user-per-day=20

# Timeout gọi OpenAI (ms)
ai.timeout-ms=10000

# Khi vượt giới hạn → trả mock thay vì gọi API
ai.fallback-to-mock=true
# =====================
# VNPay Payment Configuration
# =====================
vnpay.tmn-code=${VNPAY_TMN_CODE:YOUR_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:YOUR_HASH_SECRET}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=badmintonapp://payment-callback

vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.locale=vn

# =====================
# PayOS Payment Configuration
# =====================
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=badmintonapp://payment-callback
payos.cancel-url=badmintonapp://payment-cancel
